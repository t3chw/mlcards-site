<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MLCards - Shared Flashcard</title>

    <!-- Open Graph Meta Tags (generic but descriptive) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Check out this Flashcard!">
    <meta property="og:description" content="Learn this concept with MLCards - Master ML & Data Science with swipeable flashcards">
    <meta property="og:image" content="https://mlcards.co/assets/final_logo.png">
    <meta property="og:url" content="https://mlcards.co/share">
    <meta property="og:site_name" content="MLCards">

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Check out this Flashcard!">
    <meta name="twitter:description" content="Learn this concept with MLCards">
    <meta name="twitter:image" content="https://mlcards.co/assets/final_logo.png">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #fff;
        }

        .container {
            text-align: center;
            max-width: 400px;
        }

        .logo {
            width: 80px;
            height: 80px;
            border-radius: 16px;
            margin-bottom: 24px;
        }

        .title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 12px;
            line-height: 1.3;
        }

        .description {
            font-size: 16px;
            color: #a0a0a0;
            margin-bottom: 32px;
        }

        .btn {
            display: inline-block;
            padding: 16px 32px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            transition: transform 0.2s, box-shadow 0.2s;
            margin: 8px;
            cursor: pointer;
            border: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        .status {
            margin-top: 20px;
            font-size: 14px;
            color: #888;
            min-height: 20px;
        }

        .footer {
            margin-top: 48px;
            font-size: 14px;
            color: #666;
        }

        .error {
            color: #f56565;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="https://mlcards.co/assets/final_logo.png" alt="MLCards" class="logo">
        <h1 class="title" id="title">Shared Flashcard</h1>
        <p class="description" id="desc">Master this concept with swipeable flashcards</p>

        <a href="#" class="btn btn-primary" id="openAppBtn">Open in App</a>
        <br>
        <a href="https://play.google.com/store/apps/details?id=co.mlcards.app" class="btn btn-secondary" id="storeBtn">Get MLCards on Play Store</a>

        <p class="status" id="status"></p>
    </div>

    <p class="footer">MLCards - Learn ML the smart way</p>

    <script>
        (function() {
            // Get slug from URL parameter
            const urlParams = new URLSearchParams(window.location.search);
            const slug = urlParams.get('c');

            const titleEl = document.getElementById('title');
            const statusEl = document.getElementById('status');
            const openBtn = document.getElementById('openAppBtn');

            if (!slug) {
                titleEl.textContent = 'Invalid Link';
                titleEl.classList.add('error');
                statusEl.textContent = 'No flashcard specified in the link';
                openBtn.style.display = 'none';
                return;
            }

            // Build Intent URL for Android
            const intentUrl = 'intent://card/' + encodeURIComponent(slug) + '#Intent;scheme=mlcards;package=co.mlcards.app;end';
            const customSchemeUrl = 'mlcards://card/' + encodeURIComponent(slug);
            const playStoreUrl = 'https://play.google.com/store/apps/details?id=co.mlcards.app';

            // Detect Android
            const isAndroid = /android/i.test(navigator.userAgent);

            // Update title
            titleEl.textContent = 'Shared Flashcard';
            document.title = 'MLCards - Shared Flashcard';

            // Set up the Open in App button
            if (isAndroid) {
                openBtn.href = intentUrl;
                statusEl.textContent = 'Tap "Open in App" to view this flashcard';

                openBtn.addEventListener('click', function(e) {
                    statusEl.textContent = 'Opening MLCards...';

                    // Fallback: if app doesn't open in 2 seconds, show message
                    setTimeout(function() {
                        if (document.visibilityState !== 'hidden') {
                            statusEl.textContent = 'App not installed? Get it from Play Store';
                        }
                    }, 2000);
                });
            } else {
                // Not Android - try custom scheme anyway, fallback to store
                openBtn.href = customSchemeUrl;
                statusEl.textContent = 'Open this link on your Android device for the best experience';

                openBtn.addEventListener('click', function(e) {
                    e.preventDefault();

                    // Try custom scheme
                    window.location.href = customSchemeUrl;

                    // Fallback to Play Store after delay
                    setTimeout(function() {
                        if (document.visibilityState !== 'hidden') {
                            window.location.href = playStoreUrl;
                        }
                    }, 1500);
                });
            }
        })();
    </script>
</body>
</html>
